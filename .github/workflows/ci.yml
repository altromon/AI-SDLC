name: CI - AI-SDLC Quality Gates & Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Build Monorepo Packages (@aisdlc/core & @aisdlc/cli)
        run: pnpm run build

      - name: Run Vitest Unit & Integration Suites
        run: pnpm test

      - name: Run Executable BDD / Cucumber Feature Suite
        run: pnpm run test:bdd

      - name: Run Vitest Coverage (thresholds enforced)
        run: pnpm run test:coverage

      - name: Dogfooding - Run AI-SDLC Full Verification Suite
        run: node packages/cli/bin/aisdlc.js verify all

      - name: Upload Security Findings to GitHub Code Scanning (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && matrix.node-version == '22.x' && hashFiles('reports/security.sarif') != ''
        with:
          sarif_file: reports/security.sarif
          category: aisdlc-security
