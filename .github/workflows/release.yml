name: Release & NPM Publishing

on:
  workflow_run:
    workflows: ["CI - AI-SDLC Quality Gates & Testing"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write      # Required for OIDC and provenance
  contents: write      # Required for pushing to branches and releases
  pull-requests: write # Required for creating PRs
  attestations: write  # Required for SLSA build provenance attestations

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Build Packages
        run: pnpm run build

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GTH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Package Distribution Tarballs
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p release-artifacts
          pnpm --filter "@aisdlc/*" exec pnpm pack --pack-destination "$PWD/release-artifacts"

      - name: Install Sigstore Cosign
        if: steps.changesets.outputs.published == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign Artifacts with Sigstore Cosign (Keyless)
        if: steps.changesets.outputs.published == 'true'
        run: |
          for file in release-artifacts/*.tgz; do
            cosign sign-blob --yes --bundle "${file}.bundle" "$file"
          done

      - name: Generate SLSA Build Provenance Attestation
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-artifacts/*.tgz'
