name: AI-SDLC PR KPI Aggregator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  aggregate-kpis:
    name: Aggregate PR KPIs & Telemetry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all

      - name: Build Packages
        run: pnpm run build

      - name: Calculate and Emit PR KPIs
        id: kpi
        env:
          PR_BASE_REF: origin/${{ github.base_ref }}
          PR_HEAD_REF: HEAD
        run: |
          npx tsx scripts/aggregate-pr-kpis.ts
